name: UFFiHHiN Verify
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix: {os: [ubuntu-latest, windows-latest], node: [22]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: {node-version: ${{ matrix.node }}}
      - run: npm install
      - run: npm run verify:all
